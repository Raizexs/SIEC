name: Deploy SIEC

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-vercel:
    name: Frontend → Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Validate Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "::error::Missing VERCEL_TOKEN secret" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "::error::Missing VERCEL_ORG_ID secret" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "::error::Missing VERCEL_PROJECT_ID secret" && exit 1)
      - name: Verify Vercel API access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Token identity:"
          vercel whoami --token="$VERCEL_TOKEN"
          HTTP_CODE=$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Cannot access Vercel project (HTTP ${HTTP_CODE})."
            echo "::error::Check that VERCEL_TOKEN belongs to the team, and VERCEL_ORG_ID / VERCEL_PROJECT_ID match frontend/.vercel/project.json from 'vercel link'."
            cat /tmp/vercel-project.json || true
            exit 1
          fi
          node -e "const p=require('/tmp/vercel-project.json'); console.log('Project OK:', p.name || p.id);"
      - name: Link Vercel project (CI)
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          node <<'NODE'
          const fs = require('fs');
          const orgId = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          fs.writeFileSync(
            '.vercel/project.json',
            JSON.stringify({ orgId, projectId }),
          );
          NODE
      - name: Install and build
        run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy dist --prod --yes --token="$VERCEL_TOKEN"

  backend-railway:
    name: Backend → Railway
    runs-on: ubuntu-latest
    needs: frontend-vercel
    steps:
      - uses: actions/checkout@v4
      - name: Railway deploy
        uses: bervProject/railway-deploy@v3
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ vars.RAILWAY_SERVICE_NAME || 'siec-backend' }}

  migrations:
    name: DB migrations (Alembic)
    runs-on: ubuntu-latest
    needs: backend-railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          cd backend
          alembic upgrade head || echo "Alembic not yet configured; skipping"
