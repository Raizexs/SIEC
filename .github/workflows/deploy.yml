name: Deploy SIEC

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-vercel:
    name: Frontend → Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend

  backend-railway:
    name: Backend → Railway
    runs-on: ubuntu-latest
    needs: frontend-vercel
    steps:
      - uses: actions/checkout@v4
      - name: Railway deploy
        uses: bervProject/railway-deploy@v3
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ vars.RAILWAY_SERVICE_NAME || 'siec-backend' }}

  migrations:
    name: DB migrations (Alembic)
    runs-on: ubuntu-latest
    needs: backend-railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          cd backend
          alembic upgrade head || echo "Alembic not yet configured; skipping"
