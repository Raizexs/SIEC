services:
  db:
    image: postgres:15-alpine
    container_name: siec_postgres
    environment:
      POSTGRES_USER: siec_user
      POSTGRES_PASSWORD: siec_password
      POSTGRES_DB: siec_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siec_user -d siec_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - siec_network

  backend:
    image: python:3.11-slim
    container_name: siec_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://siec_user:siec_password@db:5432/siec_db
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    command: bash -c "pip install --no-cache-dir -r requirements.txt && sleep 10 && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - siec_network

  frontend:
    image: node:20-alpine
    container_name: siec_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - siec_network

networks:
  siec_network:
    driver: bridge

volumes:
  postgres_data:
  node_modules:
