<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HU01 - Conexion Formulario Backend</title>
  <style>
    body {
      margin: 0;
      font-family: Segoe UI, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .card {
      width: min(680px, 92vw);
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      color: #94a3b8;
    }

    input, select {
      background: #0b1220;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      background: #0ea5e9;
      color: #06283d;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      font-size: 14px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.loading {
      background: #082f49;
      border: 1px solid #0ea5e9;
    }

    .status.success {
      background: #052e16;
      border: 1px solid #22c55e;
    }

    .status.error {
      background: #450a0a;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>HU01 - Configuracion de Parametros Base</h1>
    <form id="simulacion-form">
      <div class="grid">
        <div class="field">
          <label for="m2Totales">m² Totales</label>
          <input id="m2Totales" name="m2Totales" type="number" min="15" max="1000" value="120" required />
        </div>

        <div class="field">
          <label for="materialEstructuralId">Material Estructural</label>
          <select id="materialEstructuralId" name="materialEstructuralId" required>
            <option value="1">Madera</option>
            <option value="2">Metalcom</option>
            <option value="3">Albañilería</option>
            <option value="4">Hormigón Armado</option>
          </select>
        </div>

        <div class="field">
          <label for="habitaciones">Habitaciones</label>
          <input id="habitaciones" name="habitaciones" type="number" min="0" value="2" required />
        </div>

        <div class="field">
          <label for="banios">Banos</label>
          <input id="banios" name="banios" type="number" min="0" value="1" required />
        </div>

        <div class="field full">
          <label for="areasComunes">Areas Comunes</label>
          <input id="areasComunes" name="areasComunes" type="number" min="0" value="1" required />
        </div>
      </div>

      <div class="actions">
        <button id="submit-btn" type="submit">Guardar Parametros</button>
      </div>

      <div id="status" class="status" role="alert" aria-live="polite"></div>
    </form>
  </section>

  <script src="js/hu01-form-backend.js"></script>
</body>
</html>
