[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
numReplicas = 1
startCommand = "/bin/sh -c \"uvicorn main:app --host 0.0.0.0 --port $PORT\""

[env]
ALLOWED_ORIGINS = "https://siec.app,https://www.siec.app,https://proyectsiec.vercel.app,https://proyectsiec-git-scrum-120-implementar-soporte-completo-para-materialidad-met.vercel.app"
ENVIRONMENT = "production"
