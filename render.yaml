services:
  - type: web
    name: siec-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # Lo configuras manualmente en el dashboard de Render
      - key: ALLOWED_ORIGINS
        sync: false   # Ej: https://siec-frontend.vercel.app
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_JWT_SECRET
        sync: false
